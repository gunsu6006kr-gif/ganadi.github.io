<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>생일 축하해</title>
   <style>
        /* 1. 배경을 크림색으로 변경 */
        body {
            background-color: #fdf6e3; /* 부드러운 크림색 */
            font-family: 'Verdana', sans-serif; /* 깔끔한 폰트로 변경 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 2. 카드에 테두리를 추가해 '엽서' 느낌 주기 */
        .card {
            background-color: #fff;
            padding: 50px;
            border: 2px solid #ffab91; /* 살구색 테두리 추가 */
            border-radius: 15px; /* 모서리를 조금 덜 둥글게 */
            box-shadow: 10px 10px 0px rgba(255, 171, 145, 0.3); /* 그림자를 딱딱하게 변경 (팝아트 느낌) */
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .cat-image {
            width: 150px;
            height: auto;
            margin-bottom: 25px;
            border-radius: 50%; /* 이미지를 동그랗게 자르기 (선택 사항) */
            border: 3px solid #ffab91; /* 이미지에도 테두리 추가 */
        }

        h1 {
            color: #5d4037; /* 진한 갈색 텍스트 */
            font-size: 22px;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 35px;
            border: 2px solid transparent;
            border-radius: 8px; /* 버튼을 네모나게 변경 */
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s; /* 마우스 올렸을 때 부드럽게 */
        }

        /* 3. 버튼 색상을 코랄(주황빛) 계열로 변경 */
        .yes-btn {
            background-color: #ff7043; /* 코랄색 */
            color: white;
        }
        .yes-btn:hover {
            background-color: #d84315; /* 마우스 올리면 진해짐 */
        }

        .no-btn {
            background-color: #fff;
            color: #5d4037;
            border: 2px solid #d7ccc8; /* 회색 테두리 */
        }
        .no-btn:hover {
            background-color: #efebe9;
        }

        .shy-text {
            font-size: 13px;
            color: #a1887f;
            font-style: italic; /* 이탤릭체 추가 */
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="ganadi.png" alt="Cute cat placeholder" class="cat-image">
        
        <h1>영빈아 나랑 데이트 할래?</h1>
        
        <div class="buttons">
            <button class="yes-btn">Yes</button>
            <button class="no-btn">No</button>
        </div>
        
        <p class="shy-text">"No" seems a bit shy</p>
    </div>
</body>
</html>
